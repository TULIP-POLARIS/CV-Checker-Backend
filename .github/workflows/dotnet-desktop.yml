name: .NET CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./CV-Checker-Backend/CV-Checker-Backend.slnx

      - name: Build solution
        run: dotnet build ./CV-Checker-Backend/CV-Checker-Backend.slnx --configuration Release --no-restore

